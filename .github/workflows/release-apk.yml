name: Release APK

# Builds an installable IRONBOX APK and publishes it as a GitHub Release asset.
#
#   • Push a tag  v1.0.0        → builds and releases automatically
#   • Actions tab → Run workflow → choose the corpus size and tag by hand
#
# The full 1,000,000-row corpus produces an APK of roughly 450 MB, which is far
# above the 100 MB Google Play limit — this artefact is meant for direct
# installation (sideloading), not for the Play Store.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0-full)'
        required: true
        default: 'v1.0.0-full'
      dialogues:
        description: 'Number of generated dialogue rows to package'
        required: true
        default: '1000000'
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Prepare packaged assets
        run: npm run prepare:assets

      - name: Validate packaged videos
        run: npm run videos:validate

      - name: Build the dialogue database
        env:
          DIALOGUES: ${{ github.event.inputs.dialogues || '1000000' }}
        run: |
          node tools/generate-database.js --count "$DIALOGUES" --output build/corpus.jsonl
          node tools/import-database.js
          node tools/import-database.js --input build/corpus.jsonl --append --no-fallbacks
          rm -f build/corpus.jsonl

      - name: Validate the database
        run: node tools/validate-database.js --bench

      - name: Build the APK
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Name the artefact
        id: artefact
        env:
          DIALOGUES: ${{ github.event.inputs.dialogues || '1000000' }}
        run: |
          set -euo pipefail
          LABEL=$(node -e 'const n = Number(process.argv[1]); console.log(n >= 1e6 ? `${+(n / 1e6).toFixed(2)}M` : `${Math.round(n / 1000)}k`);' "$DIALOGUES")
          NAME="ironbox-1.0-${LABEL}-dialogues.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"

          ROWS=$(node --input-type=module -e 'import {DatabaseSync} from "node:sqlite"; const db = new DatabaseSync("www/assets/databases/ironbox.db", { readOnly: true }); console.log(db.prepare("SELECT COUNT(*) AS n FROM dialogues").get().n.toLocaleString("en-US"));' 2>/dev/null)

          {
            echo "name=$NAME"
            echo "size=$(du -h "$NAME" | cut -f1)"
            echo "rows=$ROWS"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
          APK: ${{ steps.artefact.outputs.name }}
          APK_SIZE: ${{ steps.artefact.outputs.size }}
          ROWS: ${{ steps.artefact.outputs.rows }}
        run: |
          set -euo pipefail

          # Quoted heredoc: the notes are written verbatim, so backticks and $
          # in the markdown are never interpreted by the shell. Placeholders are
          # substituted afterwards with envsubst-style sed on named variables.
          cat > notes.md <<'EOF'
          # IRONBOX 1.0

          Offline Android assistant with replaceable MP4 animations, a SQLite +
          FTS5 dialogue database and push-to-talk voice interaction.

          | | |
          | --- | --- |
          | APK | `__APK__` (__APK_SIZE__) |
          | Dialogue rows | __ROWS__ |
          | Package | `com.ironbox.virtualassistant` |
          | Requires | Android 7.0 (API 24) or newer |

          ## Install

          Sideload only — this APK is far above the Play Store size limit.

          ```
          adb install -r __APK__
          ```

          Or copy it to the device and open it with a file manager, allowing
          installation from unknown sources when prompted.

          **First launch takes a while.** The packaged dialogue database is
          copied out of the installer before the assistant answers anything, so
          keep roughly twice the APK size free on the device.

          This build is signed with the standard Android debug key: it installs
          directly, but cannot be published to the Play Store. See the README
          for release signing.

          ## Replacing the character

          Put your own MP4 files in

          ```
          Android/data/com.ironbox.virtualassistant/files/IRONBOX/videos/
          ```

          or use the developer panel (gear icon) → **Import Videos**, then press
          **Reload Videos**. No code change and no rebuild.
          EOF

          sed -i "s|__APK__|$APK|g; s|__APK_SIZE__|$APK_SIZE|g; s|__ROWS__|$ROWS|g" notes.md

          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi

          gh release create "$TAG" "$APK" \
            --title "IRONBOX 1.0 — $ROWS dialogues" \
            --notes-file notes.md $FLAGS

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artefact.outputs.name }}
          path: ${{ steps.artefact.outputs.name }}
          retention-days: 14
